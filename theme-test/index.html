<!DOCTYPE html>
<html lang="en" data-theme="grist-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grist Theme Test</title>
    <link href="../shared/tailwind.css" rel="stylesheet">
</head>
<body class="bg-base-100 text-base-content p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold">Grist Light Theme Test</h1>
        
        <!-- Color swatches -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="card bg-primary text-primary-content p-4">
                <h3 class="font-bold">Primary</h3>
                <p>Grist Green</p>
            </div>
            <div class="card bg-secondary text-secondary-content p-4">
                <h3 class="font-bold">Secondary</h3>
                <p>Muted Text</p>
            </div>
            <div class="card bg-accent text-accent-content p-4">
                <h3 class="font-bold">Accent</h3>
                <p>Muted Primary</p>
            </div>
            <div class="card bg-neutral text-neutral-content p-4">
                <h3 class="font-bold">Neutral</h3>
                <p>Emphasis</p>
            </div>
        </div>

        <!-- Status colors -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="card bg-info text-info-content p-4">
                <h3 class="font-bold">Info</h3>
                <p>Information</p>
            </div>
            <div class="card bg-success text-success-content p-4">
                <h3 class="font-bold">Success</h3>
                <p>Success State</p>
            </div>
            <div class="card bg-warning text-warning-content p-4">
                <h3 class="font-bold">Warning</h3>
                <p>Warning State</p>
            </div>
            <div class="card bg-error text-error-content p-4">
                <h3 class="font-bold">Error</h3>
                <p>Error State</p>
            </div>
        </div>

        <!-- Components -->
        <div class="space-y-4">
            <h2 class="text-2xl font-semibold">Components</h2>
            
            <div class="flex flex-wrap gap-4">
                <button class="btn btn-primary">Primary Button</button>
                <button class="btn btn-secondary">Secondary Button</button>
                <button class="btn btn-accent">Accent Button</button>
            </div>

            <div class="form-control w-full max-w-xs">
                <label class="label">
                    <span class="label-text">Input Field</span>
                </label>
                <input type="text" placeholder="Type here..." class="input input-bordered w-full max-w-xs" />
            </div>

            <div class="alert alert-info">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Info alert using Grist theme colors!</span>
            </div>
        </div>
    </div>
</body>
</html>
